<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk - AM Premium Store</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="dot"></div>
        <h1 style="margin:0;font-size:20px;">AM Premium Store</h1>
        <p style="color:var(--muted);font-size:13px;margin:4px 0 0;">Top up saldo, beli Alight Motion Premium otomatis.</p>
      </div>

      <div class="card">
        <div class="auth-tabs">
          <button id="tab-login" class="active" onclick="switchTab('login')">Masuk</button>
          <button id="tab-register" onclick="switchTab('register')">Daftar</button>
        </div>

        <div id="msg-box"></div>

        <form id="login-form">
          <div class="field">
            <label>Username</label>
            <input type="text" id="login-username" required autocomplete="username">
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="login-password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Masuk</button>
        </form>

        <form id="register-form" style="display:none">
          <div class="field">
            <label>Username</label>
            <input type="text" id="reg-username" required minlength="3">
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="reg-password" required minlength="6">
            <div class="hint">Minimal 6 karakter.</div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Buat Akun</button>
        </form>
      </div>
    </div>
  </div>

<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
  </html>
